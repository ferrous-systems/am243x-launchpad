[package]
authors = ["Jonathan Pallant <jonathan.pallant@ferrous-systems.com>"]
default-run = "hello"
edition = "2024"
name = "am243x-launchpad"
description = "Examples for the Texas Instruments AM243x-Launchpad (Cortex-R5F)"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/ferrous-systems/am243x-launchpad"
homepage = "https://github.com/ferrous-systems/am243x-launchpad"
rust-version = "1.93"
version = "0.1.0"

[dependencies]
aarch32-cpu = { version = "0.4", features = ["critical-section-single-core", "defmt"] }
aarch32-rt = "0.5"
defmt = "1"
defmt-rtt = "1"
semihosting = { version = "0.1", features = ["stdio"] }

[build-dependencies]
arm-targets = "0.4"

[features]
eabi-fpu = ["aarch32-rt/eabi-fpu"]

[profile.release]
debug = 2

